name: Build frontend
description: Build the in-repository Glassmorphism public and admin frontends.

inputs:
  node-version:
    description: Node.js version available to theme build scripts.
    default: "23"
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.19.0

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Build frontend
      shell: bash
      run: |
        set -euxo pipefail
        pnpm --dir frontend/admin install --frozen-lockfile
        pnpm --dir frontend/admin exec tsc -b
        pnpm --dir frontend/admin exec vite build --base=/admin-app/
        cd frontend/public
        bun install
        KOMARI_ADMIN_DIST_READY=1 bun run sync:admin
        bun run build-only
        cd ../..

        mkdir -p web/public/defaultTheme
        rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
        test -f frontend/public/dist/index.html
        tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C frontend/public/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-default-dist.tar"
        cp -f frontend/public/komari-theme.json web/public/defaultTheme/
        node -e 'const fs=require("fs"); const p="web/public/defaultTheme/komari-theme.json"; const m=JSON.parse(fs.readFileSync(p,"utf8")); m.short="default"; m.name="SIXOSN Glassmorphism"; m.url="https://github.com/SIXOSN/komari"; fs.writeFileSync(p, JSON.stringify(m, null, 2)+"\n")'
        if [ -f frontend/public/preview.png ]; then cp -f frontend/public/preview.png web/public/defaultTheme/preview.png; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
