name: Build frontend theme
description: Build the SIXOSN Glassmorphism fork as Komari's embedded default theme.

inputs:
  node-version:
    description: Node.js version available to theme build scripts.
    default: "23"
  repository:
    description: Theme repository URL.
    default: https://github.com/SIXOSN/komari-theme-Glassmorphism
  ref:
    description: Optional theme ref to build. Uses the repository default branch when empty.
    default: "sixosn/traffic-cycle-default"
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Clone and build frontend
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf komari-default-theme
        if [ -n "${{ inputs.ref }}" ]; then
          git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repository }}" komari-default-theme
        else
          git clone --depth=1 "${{ inputs.repository }}" komari-default-theme
        fi
        cd komari-default-theme
        bun install
        bun run build-only
        cd ..

        mkdir -p web/public/defaultTheme
        rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
        test -f komari-default-theme/dist/index.html
        tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C komari-default-theme/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-default-dist.tar"
        cp -f komari-default-theme/komari-theme.json web/public/defaultTheme/
        node -e 'const fs=require("fs"); const p="web/public/defaultTheme/komari-theme.json"; const m=JSON.parse(fs.readFileSync(p,"utf8")); m.short="default"; m.name="SIXOSN Glassmorphism"; m.url="https://github.com/SIXOSN/komari-theme-Glassmorphism"; fs.writeFileSync(p, JSON.stringify(m, null, 2)+"\n")'
        if [ -f komari-default-theme/docs/preview.png ]; then cp -f komari-default-theme/docs/preview.png web/public/defaultTheme/preview.png; fi
        if [ -f komari-default-theme/preview.png ]; then cp -f komari-default-theme/preview.png web/public/defaultTheme/preview.png; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
